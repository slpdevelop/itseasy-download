[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "itseasy_download"
version = "0.1.0"
description = "CLI tool for downloading files"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
itseasy_downloader = "itseasy_download.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
package-dir = {"" = "src"}