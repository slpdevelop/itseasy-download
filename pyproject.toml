[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "file-downloader"
version = "0.1.0"
description = "CLI tool for downloading files"
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.9.0",
]

[project.scripts]
downloader = "downloader.cli:main"

[tool.setuptools.packages.find]
where = ["src"]